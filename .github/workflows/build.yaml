name: README build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: write
concurrency:
  group: readme-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        run: |-
          git config --local user.email "github-actions-bot@mrtrotid.com"
          git config --local user.name "MrTrotid/GitHub-Actions-Bot"
          git add dark_mode.svg light_mode.svg
          git add -f cache/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated README [skip ci]"
          git pull --rebase --autostash || true
          git push || (git pull --rebase && git push)
